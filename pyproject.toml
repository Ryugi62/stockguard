[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stockguard"
version = "0.3.0"
description = "Pre-trade safety layer for tokenized stocks on BNB Chain (Ondo …on tokens): ALLOW / WARN / BLOCK with plain-English reasons."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
stockguard = "stockguard.infrastructure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
